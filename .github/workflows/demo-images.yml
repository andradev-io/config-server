name: demo-images

# Release flow: images are published only when a version tag is pushed (git tag v1.2.3 && git push origin v1.2.3).
# GitHub Container Registry always, Docker Hub when the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets exist.
# Tags: x.y.z, x.y, and latest (not for pre-releases such as v1.0.0-rc.1), plus sha-<short>.
# Pull requests and manual runs only build (validate the Dockerfiles), nothing is pushed.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_NAMESPACE: ghcr.io/andradev-io
  DOCKERHUB_NAMESPACE: andradevio

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: config-server-api-demo
            context: .
            file: deploy/Dockerfile.api-demo
            build-args: ''
          - name: config-server-web
            context: src/Web
            file: src/Web/Dockerfile
            build-args: VITE_API_BASE_URL=/
          - name: config-server-demo-idp
            context: tools/demo-idp
            file: tools/demo-idp/Dockerfile
            build-args: ''
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub enabled?
        id: hub
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USER" ] && [ -n "$TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_NAMESPACE }}/${{ matrix.name }}
            ${{ steps.hub.outputs.enabled == 'true' && format('{0}/{1}', env.DOCKERHUB_NAMESPACE, matrix.name) || '' }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=https://github.com/andradev-io/config-server

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    # GitHub Release for the tag, created only after all three images were pushed. Notes are generated from the
    # merged pull requests / commits since the previous tag; v*-suffixed tags (v1.0.0-rc.1) are marked pre-release.
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists"; exit 0
          fi
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes --verify-tag $flags
