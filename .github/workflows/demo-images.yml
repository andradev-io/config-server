name: demo-images

# Builds the three sandbox images and pushes them to GitHub Container Registry (always) and Docker Hub (when the
# DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret exist). Tags: `latest` + `main` on the default branch,
# `sha-<short>` on every build, `x.y.z` / `x.y` on `v*` tags. Pull requests only build (no push).
on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_NAMESPACE: ghcr.io/andradev-io
  DOCKERHUB_NAMESPACE: andradevio

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: config-server-api-demo
            context: .
            file: deploy/Dockerfile.api-demo
            build-args: ''
          - name: config-server-web
            context: src/Web
            file: src/Web/Dockerfile
            build-args: VITE_API_BASE_URL=/
          - name: config-server-demo-idp
            context: tools/demo-idp
            file: tools/demo-idp/Dockerfile
            build-args: ''
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub enabled?
        id: hub
        env:
          USER: ${{ vars.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USER" ] && [ -n "$TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_NAMESPACE }}/${{ matrix.name }}
            ${{ steps.hub.outputs.enabled == 'true' && format('{0}/{1}', env.DOCKERHUB_NAMESPACE, matrix.name) || '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=https://github.com/andradev-io/config-server

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
